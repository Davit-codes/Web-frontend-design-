<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table align="center" style="border-color: black;" border="1"  width="80%" cellpadding="10" cellspacing="5">
         <tr>
            <th colspan="2">
                Registration Student
            </th>
         </tr>
        <tbody>
            <tr>
                <td>
                    Student Name 
                </td>
                <td>
                    <input type="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    Father's Name
                </td>
                <td>
                    <input type="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    Mother's Name 
                </td>
                <td>
                    <input type="name" name="name">

            </tr>
            <tr>
                <td>
                    Date of birth
                </td>
                <td>
                    <input type="date" name="date">

            </tr>
            <tr>
                <td>
                    Gender
                </td>
                <td>
                    <input type="radio" name="male">

                    <input type="radio" name="female">
                    <label>Female</label>
                </td>
            </tr>
            <tr>
                <td>
                    Email ID
                </td>
                <td>
                    <input type="text" name="id">
                </td>
            </tr>
            <tr>
                <td>
                    Mobile No.
                </td>
                <td>
                    <input type="text" name="mobile">
                </td>
            </tr>
            <tr>
                <td>
                    Address
                </td>
                <td>
                    <textarea name="Address"
                    rows="4"
                    cols="30"
                    placeholder="Enter your Address"
                    ></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    State
                </td>
                <td>
                    <input type="text" name="state">
                </td>
            </tr>
            <tr>
                <td>
                    City
                </td>

            </tr>
            <tr>
                <td>

                </td>
                <td>
                    <button type="submit">submit</button>
                </td>
            </tr>
        </tbody>

        </table>
    </form>
