<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/CSS/register-form/regi.css">
</head>
<body>
    <form action=""
    class="form-register">
    <h1 class="sup-title"><u><em>Account Register</em></u></h1>
    <p class="sub-title">Please, complet your information here.</p>
    <label class="first-name">First Name </label><br>
    <input class="input" placeholder="Please, insert your first name " type="name" name="name">
    <br><br>

    <label class="last-name">Last Name </label><br>
    <input class="input1" placeholder="Please, Insert your last name " type="name" name="name">
    <br><br>

    <label class="emial">Email or Address </label><br>
    <input class="input-email" placeholder="Please, Insert your email or address " type="email" name="email">
    <br><br>

    <label class="phone-num">Phone Number </label><br>
     <input class="input-phone" placeholder="Please, Insert your phone-number" type="phone" name="phone">
     <br><br>

     <label class="time-date">Date of birth :  </label>
     <input class="input-date" type="date" name="date"><br><br>

     <label class="time-birth">Time of birth : </label>
     <input class="input-time" type="time" name="time"><br><br>

     <label class="chosee-op">Choose your meeting day : </label>
     <select class="select-op" name="day" single>
         <option value="mon">Monday</option>
         <option value="tus">Tuesday</option>
         <option value="wed">Wednesday</option>
         <option value="thur">Thursday</option>
         <option value="fri">Friday</option>
         <option value="sat">Saturday</option>
         <option value="sun">Sunday</option>
    </select><br><br>

       
      <input class="focus" type="text" name="name">

    </form>
</body>
</html>
